apiVersion: apps/v1
kind: Deployment
metadata:
  name: snackager
spec:
  template:
    spec:
      nodeSelector:
        $patch: replace
        # spot wave 1 (ENG-21836): stateless staging tolerates preemption, move to the spot template.
        scheduling.cast.ai/node-template: dev-spot
      tolerations:
      - key: dedicated
        value: dev
        effect: NoSchedule
      - key: scheduling.cast.ai/scoped-autoscaler
        operator: Exists
        effect: NoSchedule
